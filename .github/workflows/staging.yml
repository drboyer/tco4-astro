name: Deploy staging to GitHub Pages

on:
  workflow_dispatch:

# Publishing a commit never deploys this workflow automatically.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  SITE_URL: https://staging.thecloudonline.net
  SITE_ENV: staging

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Require the staging custom domain
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ "$PAGES_HOST" != "staging.thecloudonline.net" || -n "$PAGES_BASE_PATH" ]]; then
            echo "::error::Set Settings > Pages > Custom domain to staging.thecloudonline.net before running this staging workflow."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build staging site
        run: npm run build
      - name: Verify generated pages and images
        run: npm run verify:build
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
